# The global gitconfig rewrites https://github.com/ to git@github.com:, and
# cargo's bundled libgit2 cannot reach the ssh-agent that the git CLI uses.
# Without this, `cargo install --git <https url>` fails to authenticate AND
# exits 0, so the failure is silent. Caught installing jj-hunk 2026-10-27.
[net]
git-fetch-with-cli = true
