add_newline = true
# 2000: the jj/git checks measure ~90ms but spike past 500ms on a cold FS cache
# or a busy machine. starship kills a module that overruns, which drops the vcs
# segment and prints a timeout warning, so give it generous headroom.
command_timeout = 2000
format = "$directory${custom.jj}${custom.git}$character"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

# Built-in git_branch is off, replaced by the two custom modules below.
# Reason: in a colocated jj repo, jj parks git HEAD on the parent of @, so git
# reports a detached HEAD and this module rendered a literal "HEAD" instead of
# anything useful. starship has no jj module and git_branch has no `when`, so
# the only way to show jj in jj repos and git elsewhere is to own both.
[git_branch]
disabled = true

# jj repos — the bookmark name when @ sits on one (`main*`, the * being jj's own
# marker for a bookmark ahead of its remote), otherwise `@` plus the short change
# id. The @ prefix is the tell: no bookmark here, this is a bare change. Unlike
# git you are usually NOT on a named thing, so the common case needs to look
# different from a branch rather than like a cryptic one.
# `jj root` walks ancestors, so this fires anywhere inside the repo.
# --ignore-working-copy on both calls: without it, every prompt render would
# snapshot the working copy, writing to the repo just to draw a prompt.
[custom.jj]
description = "jj bookmark, or @ + short change id"
when = "jj root --ignore-working-copy"
command = "jj log -r@ --no-graph --ignore-working-copy -T 'if(bookmarks, bookmarks.join(\" \"), \"@\" ++ change_id.shortest(4))'"
format = "[$output]($style) "
style = "bold"

# Plain-git repos only — the `!` suppresses this inside jj repos so the two
# never both render. Second test keeps it quiet outside any repo.
[custom.git]
description = "git branch, outside jj repos"
when = "! jj root --ignore-working-copy > /dev/null 2>&1 && git rev-parse --is-inside-work-tree > /dev/null 2>&1"
command = "git branch --show-current"
format = "[$output]($style) "
style = "bold"

[gcloud]
disabled = true

[cmd_duration]
disabled = true
