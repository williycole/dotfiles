# Change prefix from Ctrl+b to Ctrl+Space
unbind C-b
set -g extended-keys on
set -g extended-keys-format csi-u
set -g prefix C-Space

bind C-Space send-prefix

bind -r h select-window -t :-
bind -r l select-window -t :+
bind Tab select-pane -t :.+
bind ^ last-window
bind r command-prompt -I "#W" "rename-window '%%'"
# bind n new-window
bind c new-window -c "#{pane_current_path}"

# Split keys matched to herdr (v = side-by-side, - = stacked). tmux's own " and %
# stay bound as well; these are the ones shared with herdr.
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind T new-window "~/.config/tmux/ghostty-theme-picker.sh"
bind G run-shell "~/.config/tmux/ghostty-reload.sh"
bind y run-shell "tmux capture-pane -pS - | pbcopy" \; display "Pane copied to clipboard"

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @tmux-which-key-xdg-enable 1
set -g @plugin 'alexwforsythe/tmux-which-key'

set -g mouse on

set -as terminal-overrides ",xterm*:Kitty*:"

# Let Kitty graphics escapes (casty, image.nvim) pass through to Ghostty
set -g allow-passthrough on

# 12-hour clock
set -g status-right-length 120
set -g status-right "#(~/.config/tmux/git-status.sh '#{pane_current_path}') %I:%M %p "

# Nobara ran tmux inside a dev distrobox at one point, and the status bar
# flagged which side you were on. Everything is on the host now, so the flag
# would always read "host" — dropped rather than left as permanent decoration.

# Kanagawa tab highlight
set -g window-status-current-format "#[fg=#1F1F28,bg=#7E9CD8,bold] #I:#W "
set -g window-status-format "#[fg=#727169,bg=default] #I:#W "

run '~/.tmux/plugins/tpm/tpm'



set -g renumber-windows on
