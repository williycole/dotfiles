# Target modes that git cannot carry.
#
# Git records exactly one permission bit: the executable bit. A file committed at
# 0600 comes back 0644 on clone, and .gitattributes cannot set modes either.
# Symlinks do not help — access is decided by the target's mode. OpenSSH refuses a
# private key at 0644, so this file is a requirement, not hygiene.
#
# Only paths that exist on EVERY machine belong here. Anything OS-specific goes in
# os/<darwin|linux>/modes.conf, which this file is layered with — the karabiner
# entries moved to os/darwin/modes.conf for exactly that reason.
#
# Applied by `just perms`. Safe to re-run. Paths are relative to $HOME.
# Format:  <octal> <TAB or spaces> <path>
# Only declare modes OTHER than 644 (files) and 755 (executables) — git handles those.
# A missing target is reported by name, not treated as an error.
#
# SOURCE: `chezmoi archive` mode manifest, 2026-08-27, saved at
# ~/.cache/dotfiles-migration/known-good-modes.txt. That render is authoritative
# because it is what chezmoi actually produces, so section 4's proof gate compares
# against the same numbers this file asserts.

# ── directories ───────────────────────────────────────────────────────────────
# These carried `private_` on the DIRECTORY in the chezmoi source, which is why
# files inside them read 644 while the directory itself is 700.
#
# NOTE: `.pi` and `.omp` are 755, not 700. An earlier version of this file
# declared both at 700 by reading the `dot_pi/private_agent/` source name one
# level too high — `private_` was on `agent`, not on `pi`. The archive manifest
# and a live measurement both say 755. Do not "restore" the 700.
700  .config/atuin
700  .config/jj
700  .cursor
700  .omp/agent
700  .pi/agent

# ── files ─────────────────────────────────────────────────────────────────────
600  .claude/hooks/peon-ping/config.json
600  .config/atuin/config.toml
600  .config/gh/config.yml
600  .config/gh/hosts.yml
700  .cursor/cli-config.json
