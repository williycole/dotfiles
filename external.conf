# Files vendored from outside the repo.
#
# Refreshed only by `just external`. There is no automatic refresh interval — that
# was `.chezmoiexternal`'s refreshPeriod and it has no replacement here on purpose.
# Pin every source to a tag or commit, never a moving branch.
#
# Note most plugin managers already fetch and pin their own dependencies
# (lazy.nvim, tpm, sheldon), so this file should stay short.
#
# Paths are relative to $HOME.
# Format:  <path> | <url>

.bash-preexec.sh | https://raw.githubusercontent.com/rcaloras/bash-preexec/0.6.0/bash-preexec.sh
