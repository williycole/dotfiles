# macOS-only mode declarations. Layered on top of the repo-root modes.conf by
# `just perms` and `just status`; see modes_lines() in bin/dots.
#
# Karabiner-Elements is macOS-only and its files live in os/darwin/.config/karabiner.
# These four entries used to sit in the shared modes.conf, which meant every run on
# Nobara printed four "not present" warnings for an app that box will never have.

700  .config/karabiner
700  .config/karabiner/assets
700  .config/karabiner/assets/complex_modifications

600  .config/karabiner/karabiner.json
