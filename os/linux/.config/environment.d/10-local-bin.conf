# Put ~/.local/bin on the GRAPHICAL SESSION's PATH.
#
# WHY THIS EXISTS: .desktop files get no shell expansion, so `Exec=godot`
# resolves only against the session PATH — which systemd builds itself and which
# does NOT include ~/.local/bin by default. A shell login gets it from
# mise/common.sh, so everything looks fine from a terminal while every launcher
# and global shortcut pointing at a ~/.local/bin binary silently fails with
# "Could not find the program". Godot is what surfaced it (2026-08-20); the same
# trap was waiting for odin, ols, odinfmt, nvim, omp and glow.
#
# systemd expands $VAR here, unlike .desktop Exec lines.
PATH=$HOME/.local/bin:$PATH
